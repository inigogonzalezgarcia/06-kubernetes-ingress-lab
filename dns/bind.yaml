# Authoritative DNS for lab.example inside the cluster (BIND 9).
# external-dns updates it with RFC 2136 dynamic updates signed with a TSIG key: the same
# mechanism used with corporate DNS servers (BIND, Infoblox, Windows DNS with secure updates).
# The TSIG key is generated by scripts/up.sh into the Secret "tsig"; it is never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bind-config
  namespace: dns
data:
  named.conf: |
    include "/etc/bind/keys/tsig.key";

    options {
      directory "/var/cache/bind";
      listen-on { any; };
      listen-on-v6 { none; };
      allow-query { any; };
      recursion no;            # authoritative only
      dnssec-validation no;
    };

    zone "lab.example" {
      type primary;
      file "/var/lib/bind/db.lab.example";
      allow-update { key "externaldns-key"; };   # only signed updates
      allow-transfer { key "externaldns-key"; }; # external-dns reads the zone with AXFR
    };
  db.lab.example: |
    $TTL 60
    @   IN SOA ns1.lab.example. hostmaster.lab.example. (
            1     ; serial
            60    ; refresh
            60    ; retry
            3600  ; expire
            60 )  ; negative TTL
    @   IN NS  ns1.lab.example.
    ns1 IN A   127.0.0.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind
  namespace: dns
  labels:
    app: bind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bind
  template:
    metadata:
      labels:
        app: bind
    spec:
      automountServiceAccountToken: false
      initContainers:
        # The zone must be writable (dynamic updates rewrite it and add a journal).
        - name: copy-zone
          image: BIND_IMAGE
          command: ["sh", "-c", "cp /config/db.lab.example /zone/ && chmod 666 /zone/db.lab.example"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: zone
              mountPath: /zone
      containers:
        - name: bind
          image: BIND_IMAGE
          command: ["/usr/sbin/named", "-g", "-c", "/etc/bind/named.conf", "-u", "bind"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 53
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/bind/named.conf
              subPath: named.conf
            - name: tsig
              mountPath: /etc/bind/keys
              readOnly: true
            - name: zone
              mountPath: /var/lib/bind
            - name: cache
              mountPath: /var/cache/bind
      volumes:
        - name: config
          configMap:
            name: bind-config
        - name: tsig
          secret:
            secretName: tsig
            defaultMode: 0444
            items:
              - key: tsig.key
                path: tsig.key
        - name: zone
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bind
  namespace: dns
spec:
  selector:
    app: bind
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
