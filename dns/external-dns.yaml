# external-dns: publishes the hostnames of HTTPRoutes attached to the Gateway as DNS records
# in lab.example, pointing at the Gateway's address. A TXT "ownership" record is written next
# to every record it creates, so it never touches records it does not own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  # Read-only, and only what the Gateway API source needs.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: dns
  labels:
    app: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate # never two writers for the same zone
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: EXTERNAL_DNS_IMAGE
          args:
            - --source=gateway-httproute
            - --gateway-name=lab
            - --gateway-namespace=gateway
            - --provider=rfc2136
            - --rfc2136-host=bind.dns.svc.cluster.local
            - --rfc2136-port=53
            - --rfc2136-zone=lab.example
            - --rfc2136-tsig-keyname=externaldns-key
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-axfr
            - --domain-filter=lab.example
            - --registry=txt
            - --txt-owner-id=ingress-lab
            - --policy=sync # also deletes records whose route is removed
            - --interval=15s
          env:
            - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: tsig
                  key: secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
