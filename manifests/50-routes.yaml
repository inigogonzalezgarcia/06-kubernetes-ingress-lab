# HTTP only redirects to HTTPS; the HTTPS route carries timeouts and a rate limit.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-redirect
  namespace: apps
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: http
  hostnames:
    - orders.lab.example
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: apps
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - orders.lab.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: orders
          port: 9898
      timeouts:
        request: 10s
---
# Local (per proxy) rate limit for the whole route: 30 requests per minute.
# Low on purpose, so the test can show a 429 without generating much traffic.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: orders-limits
  namespace: apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: orders
  rateLimit:
    local:
      rules:
        - limit:
            requests: 30
            unit: Minute
