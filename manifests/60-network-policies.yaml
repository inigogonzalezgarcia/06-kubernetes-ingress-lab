# Zero trust inside the apps namespace:
#  1. Nothing may talk to or from pods in "apps" unless a rule below allows it.
#  2. Pods may resolve names through cluster DNS.
#  3. Only the Envoy Gateway proxies may reach the orders service, and only with a short list
#     of GET paths (Cilium L7 policy). Everything else, e.g. podinfo's /env, is refused with 403.
#  4. The kubelet on the same node may run the health probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: apps
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: apps
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: orders-from-gateway
  namespace: apps
spec:
  endpointSelector:
    matchLabels:
      app: orders
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/"
              - method: GET
                path: "/version"
              - method: GET
                path: "/healthz"
              - method: GET
                path: "/readyz"
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP
