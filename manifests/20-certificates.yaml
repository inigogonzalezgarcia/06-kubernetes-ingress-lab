# A private CA for the lab, managed by cert-manager:
#   self-signed issuer -> lab CA certificate -> CA issuer -> wildcard certificate for the Gateway.
# In a real environment the CA issuer would be ACME (Let's Encrypt) or a corporate PKI.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Ingress Lab CA
  secretName: lab-ca
  duration: 2160h # 90 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard
  namespace: gateway
spec:
  secretName: lab-wildcard-tls
  dnsNames:
    - "*.lab.example"
  duration: 720h    # 30 days
  renewBefore: 240h # renewed 10 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
